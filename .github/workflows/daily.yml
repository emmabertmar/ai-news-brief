name: Daily AI Brief

# when to run
on:
  schedule:
    - cron: "0 5 * * *"   # 07:00 Stockholm in summer (CEST = UTC+2)
    - cron: "0 6 * * *"   # 07:00 Stockholm in winter (CET = UTC+1)
  workflow_dispatch:        # also lets you run it by hand from the Actions tab

# what to do
jobs:
  build:
    runs-on: ubuntu-latest              # GitHub gives us a fresh Linux machine
    steps:
      - uses: actions/checkout@v4       # copy your repo onto that machine

      - uses: actions/setup-python@v5   # install Python
        with:
          python-version: "3.12"

      - name: Install ffmpeg            # install ffmpeg (Linux way)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages   # install from requirements.txt
        run: pip install -r requirements.txt

      - name: Run the brief             # run the script
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # hand it the secret