name: Daily AI Brief

on:
  schedule:
    - cron: "0 5 * * *"   # 07:00 Stockholm in summer (CEST)
    - cron: "0 6 * * *"   # 07:00 Stockholm in winter (CET)
  workflow_dispatch:

permissions:
  contents: write          # allow the workflow to push files back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run the brief
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      